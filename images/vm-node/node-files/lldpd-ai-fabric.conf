# ai-fabric: what lldpd advertises on a lab node. Distributed by node-sync.sh (repository = what the guest runs), so the
# persistence check covers it and a drifted guest is repaired.
#
# The interface pattern matters. Without the exclusions lldpd runs on Cilium's veth pair and the node discovers ITSELF
# (SysName ctrl1.lab.ai on cilium_net/cilium_host). eth0 is the containerlab management network -- it has no lab switch on
# it, so advertising there is pure noise. What is left is exactly the lab wiring: the fabric bond members, the rail NICs on
# a GPU node, and the OOB/BMC NIC.
# !gpu* excludes the RAIL NICs, and that exclusion is not cosmetic. LLDP from 32 GPU nodes arriving on a rail leaf
# while it is still running ifconfig at boot panics the OcNOS demo VM's kernel:
#   BUG: kernel NULL pointer dereference at 0 ... RIP: 0x0 ... __netif_receive_skb_core ... page_to_skb [virtio_net]
# Seven of eight rail leaves crash-looped on the first cold boot after LLDP was enabled (2026-09-21); five recovered
# the moment lldpd was stopped on the guests. The spines face only 8 peers and survived. LLDP on the rails was a
# nice-to-have; LLDP on the fabric bond members (Cumulus leaves) and the OOB NIC (vEX oob-sw) is what was wanted,
# and those are unaffected.
configure system interface pattern *,!eth0,!lo,!gpu*,!cilium*,!lxc*,!veth*,!docker*,!kube*,!nodelocal*,!tunl*,!ip6tnl*
configure lldp portidsubtype ifname
configure system description "ai-fabric lab node"
