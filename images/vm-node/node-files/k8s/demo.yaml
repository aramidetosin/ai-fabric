# Demo application behind the Gateway: whoami echoes the serving pod/node, so the PC test shows
# which node answered. Three replicas spread across the nodes.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: demo
spec:
  replicas: 3
  selector:
    matchLabels: {app: whoami}
  template:
    metadata:
      labels: {app: whoami}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels: {app: whoami}
              topologyKey: kubernetes.io/hostname
      containers:
      - name: whoami
        image: traefik/whoami:v1.11.0
        args: ["--port=8080", "--name=${CLUSTER_NAME}-demo"]
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: demo
spec:
  selector: {app: whoami}
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo
  namespace: demo
spec:
  parentRefs:
  - name: gateway
    namespace: gateway
  hostnames: ["demo.platform.${DOMAIN}"]
  rules:
  - backendRefs:
    - name: whoami
      port: 80
