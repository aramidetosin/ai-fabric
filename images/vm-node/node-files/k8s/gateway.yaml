# The platform Gateway (Cilium Gateway API), as reference: one HTTPS listener for the platform
# wildcard, TLS terminated with the cert-manager wildcard, pinned to the L2-announced VIP.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: gateway
spec:
  gatewayClassName: cilium
  addresses:
  - type: IPAddress
    value: ${GW_VIP}
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "*.platform.${DOMAIN}"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: listener-tls
