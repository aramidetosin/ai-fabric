# Longhorn UI behind the platform Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  parentRefs:
  - name: gateway
    namespace: gateway
  hostnames: ["${LONGHORN_HOST}"]
  rules:
  - backendRefs:
    - name: longhorn-frontend
      port: 80
