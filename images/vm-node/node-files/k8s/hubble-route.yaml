# Hubble UI behind the platform Gateway (as reference's network.platform route, without the OAuth proxy).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
  - name: gateway
    namespace: gateway
  hostnames: ["hubble.platform.${DOMAIN}"]
  rules:
  - backendRefs:
    - name: hubble-ui
      port: 80
