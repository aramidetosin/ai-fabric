# ClusterIssuer "cluster-ca" (backed by secret cert-manager/cluster-ca: self-signed from pki-selfsigned-ca.yaml, or the lab Platform CA) + platform wildcard.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cluster-ca
spec:
  ca:
    secretName: cluster-ca
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: listener-tls
  namespace: gateway
spec:
  secretName: listener-tls
  dnsNames: ["*.platform.${DOMAIN}"]
  duration: 2160h
  issuerRef:
    name: cluster-ca
    kind: ClusterIssuer
    group: cert-manager.io
