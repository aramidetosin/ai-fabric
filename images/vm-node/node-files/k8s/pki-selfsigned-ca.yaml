# Self-signed cluster CA (as reference). Applied by cluster-bootstrap.sh ONLY when no lab CA is provided; with the site-a-nx lab CA the
# secret cert-manager/cluster-ca is created from the dns-b-issued Platform CA instead (see cluster-bootstrap.sh).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: cluster-ca
  subject:
    organizations: ["${CLUSTER_NAME}"]
    organizationalUnits: ["ai-fabric lab"]
  secretName: cluster-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
