apiVersion: kubeadm.k8s.io/v1beta4
kind: JoinConfiguration
discovery:
  bootstrapToken:
    apiServerEndpoint: "api.${DOMAIN}:6443"
    token: "${JOIN_TOKEN}"
    unsafeSkipCAVerification: true
  timeout: 10m0s
controlPlane:
  localAPIEndpoint:
    advertiseAddress: ${NODE_IP}
    bindPort: 6443
  certificateKey: "${CERT_KEY}"
nodeRegistration:
  name: ${NODE_NAME}
  kubeletExtraArgs:
  - name: node-ip
    value: "${NODE_IP}"
