# ai-fabric bastion: advertise on the fabric bond members and the OOB NIC, not on the containerlab management network (eth0).
# The bastion is a plain container wired with veths straight to the leaves, so unlike the VM guests it needs no bridge
# group_fwd_mask change -- there is no bridge in its path to filter 01:80:c2:00:00:0e.
configure system interface pattern *,!eth0,!lo
configure lldp portidsubtype ifname
configure system description "ai-fabric bastion"
