# ai-fabric.clab.example.yml -- the containerlab topology this lab deploys, for the `site-b-nx` profile.
#
# THIS FILE IS AN EXAMPLE, NOT A DEPLOYABLE TOPOLOGY. It is here so you can read the shape of the lab
# (67 nodes, 437 links) without running anything. Two things make it non-deployable as it stands:
#
#   1. The image names are placeholders (YOUR_REGISTRY/...). Vendor network OS images are licensed and
#      are not distributed here -- build them with vrnetlab and set your own tags in .env (RUNBOOK, 2).
#   2. Every switch binds a generated config (configs/<device>.cfg) and the firewall binds
#      bootstrap/fw.xml. Those are written by gen.py and are not in the repository.
#
# The secrets below are deliberately fake: LAB_ROOT_PASSWORD/LAB_ADMIN_PASSWORD are the containerlab
# default `admin`, JOIN_TOKEN and CERT_KEY are dummies. Your own come from .env, and gen.py puts the
# real values into the topology it writes -- which is why *.clab.yml is gitignored.
#
# To get a topology you can actually deploy:
#
#   cp .env.example .env && $EDITOR .env          # image tags + kubeadm token/cert key
#   cp common/authorized_keys.example common/authorized_keys
#   cat /root/.ssh/id_ed25519.pub >> common/authorized_keys     # on the lab host -> NX-OS user `ops`
#   echo site-b-nx > profile                      # or site-a | site-a-nx | site-b
#   set -a; . ./.env; set +a
#   python3 gen.py                                # writes ai-fabric.clab.yml, configs/, bootstrap/fw.xml
#   containerlab deploy -t ai-fabric.clab.yml --reconfigure --max-workers 8
#
# `./up.sh` runs exactly that and then everything a bare `containerlab deploy` does NOT do: holding the
# guests until the fabric converges, waiting for the switches to answer as `ops`, the vPC fabric-peering
# TCAM carve, re-running pc-init.sh after the links settle, and finish.sh's nine stages. A bare deploy
# gives you running containers; it does not give you a working cluster. See RUNBOOK.md section 4.
# ai-fabric: Cumulus frontend + OcNOS rail backend + refplat-style k8s VM nodes. Generated by gen.py -- edit gen.py, not this file.
name: ai-fabric
mgmt:
  network: ai-fabric-mgmt
  ipv4-subnet: 172.21.21.0/24
topology:
  kinds:
    nvidia_cumulusvx:
      image: YOUR_REGISTRY/cumulus-vx:YOUR_TAG
    juniper_vjunosswitch:
      image: YOUR_REGISTRY/vjunos-switch:YOUR_TAG
    cisco_n9kv:
      image: YOUR_REGISTRY/n9kv:YOUR_TAG
      env:
        CLAB_MGMT_PASSTHROUGH: "true"
        SCRAPLI_TIMEOUT: "604800"
    ipinfusion_ocnos:
      image: YOUR_REGISTRY/ocnos:YOUR_TAG
    paloalto_panos:
      image: YOUR_REGISTRY/pa-vm:YOUR_TAG
    linux:
      dns:
        servers: [8.8.8.8, 1.1.1.1]
  nodes:
