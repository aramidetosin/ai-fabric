  sensor-group 537
    data-source DME
    path sys/intf query-condition query-target=subtree&target-subtree-class=ethpmPhysIf
  sensor-group 538
    data-source DME
    path sys/vpc depth unbounded query-condition query-target=subtree&target-subtree-class=vpcDom,vpcIf,vpcPeerLink,vpcRsVpcConf
  sensor-group 539
    data-source DME
    path sys/ipv4 query-condition query-target=subtree&target-subtree-class=ipv4If,ipv4Addr
  sensor-group 540
