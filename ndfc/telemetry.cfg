# ndfc/telemetry.cfg -- the Nexus Dashboard telemetry block, VERBATIM from `show running-config` of the site-a-nx frontend
# (identical on all 10 N9Kv; captured 2026-09-28 into saved-running-20260928/). Nexus Dashboard pushed it when fabric
# Site-4-frontend was onboarded (2026-09-26); it was never in gen.py, so a redeploy would have dropped it. up.sh runs
# nx-telemetry.sh after boot (profiles with ndfc=True); "#" lines are stripped. 172.29.129.135:57500 = the ND gRPC
# collector. Edit only by re-capturing from a switch.
telemetry
  destination-profile
    use-vrf default
    source-interface loopback0
  destination-group 500
    ip address 172.29.129.135 port 57500 protocol gRPC encoding GPB
  destination-group 501
    ip address 172.29.129.135 port 57500 protocol gRPC encoding GPB-compact
  sensor-group 500
    data-source NX-API
    path "show icam scale" depth unbounded
    path "show processes cpu" depth unbounded
    path "show processes memory physical" depth unbounded
    path "show spanning-tree summary" depth unbounded
  sensor-group 501
    data-source DME
    path sys/exitproc depth unbounded query-condition query-target=subtree&target-subtree-class=procExitProcEntry
  sensor-group 502
    data-source NX-API
    path "show ipv6 interface brief VRF all" depth unbounded
    path "show lacp counters detail" depth unbounded
    path "show lacp interface" depth unbounded
    path "show lldp traffic interface all" depth unbounded
    path "show port-channel summary" depth unbounded
    path "show system internal flash" depth unbounded
  sensor-group 503
    data-source NX-API
    path "show ipv6 adjacency vrf all" depth unbounded
  sensor-group 504
    data-source DME
    path sys/bd depth unbounded query-condition query-target=subtree&target-subtree-class=l2BD,l2VlanMemberIf
  sensor-group 505
    data-source DME
    path sys/bd depth unbounded query-condition query-target=subtree&target-subtree-class=l2VlanStats
  sensor-group 506
    data-source DME
    path sys/eps depth unbounded query-condition query-target=subtree&target-subtree-class=nvoEps,nvoEp,nvoOperNw
  sensor-group 507
    data-source DME
    path sys/mgmt-[mgmt0] depth unbounded query-condition query-target=subtree&target-subtree-class=mgmtMgmtIf,imMgmtIf
  sensor-group 508
    data-source DME
    path sys/intf query-condition query-target=subtree&target-subtree-class=tunnelifIf
  sensor-group 509
    data-source DME
    path sys/ch depth unbounded query-condition query-target=subtree&target-subtree-class=eqptPsu
    path sys/intf query-condition query-target=subtree&target-subtree-class=l1PhysIf&query-target-filter=eq(l1PhysIf.adminSt,"up")&rsp-subtree=children&target-subtree-class=ethpmPhysIf&query-target-filter=eq(ethpmPhysIf.operSt,"up")&rsp-subtree-depth=2&rsp-ancestor-depth=1
    path sys/ipqos depth unbounded query-condition query-target=subtree&target-subtree-class=ipqosQueuingStats&query-target-filter=or(ne(ipqosQueuingStats.pfcRxPpp,"0"),ne(ipqosQueuingStats.randEcnMarkedPackets,"0"),ne(ipqosQueuingStats.pfcTxPpp,"0"),ne(ipqosQueuingStats.dropPackets,"0"))
    path sys/mgmt-[mgmt0] depth unbounded query-condition query-target=subtree&target-subtree-class=mgmtMgmtIf,imMgmtIf,rmonDot3Stats,rmonEtherStats,rmonIfIn,rmonIfOut
  sensor-group 510
    data-source DME
    path sys/intf depth unbounded query-condition query-target=subtree&target-subtree-class=l3LbRtdIf,ethpmLbRtdIf
  sensor-group 511
    data-source DME
    path sys query-condition query-target=subtree&target-subtree-class=l3Inst
    path sys/ch depth 1 query-condition query-target=subtree&target-subtree-class=eqptSensor
    path sys/intf query-condition query-target=subtree&target-subtree-class=eqptFcotLane,eqptFcotSensor
  sensor-group 512
    data-source DME
    path sys/ch depth 1 query-condition query-target=subtree&target-subtree-class=eqptFan
    path sys/ospfv3 depth 1 query-condition query-target=subtree&target-subtree-class=ospfv3AdjStats
  sensor-group 513
    data-source NX-API
    path "show nve peers detail" depth unbounded
    path "show nve vni" depth unbounded
    path "show system internal icam app system internal access-list resource utilization" depth unbounded query-condition show-output-format=json
  sensor-group 514
    data-source NX-API
    path "show feature" depth unbounded
    path "show system routing mode" depth unbounded
  sensor-group 515
    data-source DME
    path sys/bgp depth 1 query-condition query-target=subtree&target-subtree-class=bgpPeerEntryStats,bgpPeerAfEntry
    path sys/cdp depth 1 query-condition query-target=subtree&target-subtree-class=cdpIf,cdpIfStats,cdpAdjEp,cdpInst
    path sys/lldp depth 1 query-condition query-target=subtree&target-subtree-class=lldpIf,lldpAdjEp,lldpIfStats
    path sys/ospf depth 1 query-condition query-target=subtree&target-subtree-class=ospfAdjStats
    path sys/pim/pimdomdb query-condition rsp-subtree=full&rsp-foreign-subtree=ephemeral
    path sys/pim/pimifdb-stats query-condition rsp-subtree=full&rsp-foreign-subtree=ephemeral
  sensor-group 516
    data-source DME
    path sys/cdp depth unbounded query-condition query-target=subtree&target-subtree-class=cdpIf,cdpAdjEp,cdpInst,cdpMgmtAddr
  sensor-group 517
    data-source DME
    path sys/bgp depth unbounded query-condition query-target=subtree&complete-mo=yes&notify-interval=1&target-subtree-class=bgpEntity,bgpInst,bgpDom,bgpDomAf,bgpPeer,bgpPeerEntry,bgpPeerEvents
  sensor-group 518
    data-source DME
    path sys/ospf depth unbounded query-condition query-target=subtree&target-subtree-class=ospfIf,ospfInst,ospfDom,ospfArea,ospfAdjEp,ospfAuthNewP
  sensor-group 519
    data-source DME
    path sys/ospfv3 depth unbounded query-condition query-target=subtree&target-subtree-class=ospfv3Inst,ospfv3Dom,ospfv3Area,ospfv3If,ospfv3AdjEp,ospfv3IfAuthNewP,ospfv3AreaAuthNewP
  sensor-group 520
    data-source DME
    path sys/lldp depth unbounded query-condition query-target=subtree&target-subtree-class=lldpIf,lldpAdjEp,lldpInst
  sensor-group 521
    data-source DME
    path sys/intf depth unbounded query-condition query-target=subtree&target-subtree-class=pcAggrIf&query-target-filter=deleted()
  sensor-group 522
    data-source DME
    path sys/ch depth unbounded query-condition query-target=subtree&complete-mo=yes&notify-interval=1&target-subtree-class=eqptLC,eqptSupC,eqptFtSlot,eqptFt,eqptPsuSlot,eqptFan,eqptFC,eqptSysC
  sensor-group 523
    data-source DME
    path sys/ch depth unbounded query-condition query-target=subtree&target-subtree-class=eqptPsu&query-target-filter=or(and(updated(eqptPsu.operSt),eq(eqptPsu.operSt,"ok")),and(updated(eqptPsu.operSt),ne(eqptPsu.operSt,"ok")))
  sensor-group 524
    data-source NX-API
    path "show queuing burst-detect detail" depth unbounded
  sensor-group 525
    data-source NATIVE
    path adjacency
    path mac-all
  sensor-group 526
    data-source DME
    path sys/intf depth unbounded query-condition query-target=subtree&complete-mo=yes&notify-interval=1&target-subtree-class=ethpmAggrIf&rsp-subtree=children
  sensor-group 527
    data-source NX-API
    path "show system resources" depth unbounded
  sensor-group 528
