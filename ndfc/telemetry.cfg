    path sys/intf query-condition query-target=subtree&target-subtree-class=l3EncRtdIf&query-target-filter=eq(l3EncRtdIf.adminSt,"up")&rsp-subtree=children&target-subtree-class=ethpmEncRtdIf&query-target-filter=eq(ethpmEncRtdIf.operSt,"up")&rsp-subtree-depth=2&rsp-ancestor-depth=1
